<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waveform — Music Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#2A0E37;
    --bg-2:#150822;
    --card:rgba(255,255,255,0.06);
    --line:rgba(255,255,255,0.12);
    --pink:#FF4FA3;
    --cyan:#4FE8FF;
    --text:#F3EFFA;
    --muted:#B3A6C7;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh; background:radial-gradient(circle at 20% 0%, var(--bg-1), var(--bg-2) 70%);
    color:var(--text); font-family:'Inter',sans-serif; display:flex; align-items:center; justify-content:center;
    padding:30px 16px;
  }
  h1,h2,h3{font-family:'Sora',sans-serif;}

  .player{
    width:380px; max-width:100%; background:var(--card); border:1px solid var(--line); border-radius:28px;
    padding:28px; backdrop-filter:blur(14px); box-shadow:0 30px 70px rgba(0,0,0,0.5);
  }
  .player-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:22px;}
  .player-top .label{font-size:0.78rem; letter-spacing:0.08em; color:var(--muted); text-transform:uppercase;}
  .playlist-btn{background:none; border:1px solid var(--line); color:var(--text); border-radius:100px; padding:6px 14px; font-size:0.75rem; cursor:pointer;}
  .playlist-btn:hover{border-color:var(--pink);}

  .art{
    aspect-ratio:1; border-radius:22px; margin-bottom:22px; display:flex; align-items:center; justify-content:center;
    font-size:3.6rem; position:relative; overflow:hidden;
    background:linear-gradient(135deg, var(--pink), var(--cyan));
  }
  .art .disc{
    width:70%; height:70%; border-radius:50%; background:rgba(0,0,0,0.35); display:flex; align-items:center; justify-content:center;
    animation:spin 8s linear infinite; animation-play-state:paused;
  }
  .art.playing .disc{animation-play-state:running;}
  .art .disc::after{content:""; width:22%; height:22%; border-radius:50%; background:var(--bg-2);}
  @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

  .track-info{text-align:center; margin-bottom:20px;}
  .track-info h3{font-size:1.2rem; margin-bottom:4px;}
  .track-info p{color:var(--muted); font-size:0.88rem;}

  .progress-row{display:flex; align-items:center; gap:10px; margin-bottom:22px;}
  .time{font-size:0.72rem; color:var(--muted); font-variant-numeric:tabular-nums; width:34px;}
  .time.end{text-align:right;}
  #progressBar{
    flex:1; -webkit-appearance:none; height:5px; border-radius:10px; background:var(--line); cursor:pointer;
  }
  #progressBar::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:var(--pink); cursor:pointer; box-shadow:0 0 8px rgba(255,79,163,0.7);
  }

  .controls{display:flex; align-items:center; justify-content:center; gap:22px; margin-bottom:22px;}
  .ctrl-btn{background:none; border:none; color:var(--text); font-size:1.3rem; cursor:pointer; opacity:0.85; transition:.15s;}
  .ctrl-btn:hover{opacity:1; transform:scale(1.08);}
  .ctrl-btn.play-pause{
    width:58px; height:58px; border-radius:50%; background:linear-gradient(135deg,var(--pink),var(--cyan));
    display:flex; align-items:center; justify-content:center; font-size:1.4rem; color:#150822;
  }
  .ctrl-btn.small{font-size:1rem;}

  .volume-row{display:flex; align-items:center; gap:10px; margin-bottom:20px;}
  .volume-row span{font-size:0.95rem;}
  #volumeBar{flex:1; -webkit-appearance:none; height:5px; border-radius:10px; background:var(--line); cursor:pointer;}
  #volumeBar::-webkit-slider-thumb{-webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:var(--cyan); cursor:pointer;}

  .playlist{display:none; flex-direction:column; gap:6px; max-height:220px; overflow-y:auto; margin-top:6px; border-top:1px solid var(--line); padding-top:14px;}
  .playlist.open{display:flex;}
  .playlist-item{
    display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-radius:10px; cursor:pointer; font-size:0.88rem; transition:.15s;
  }
  .playlist-item:hover{background:rgba(255,255,255,0.06);}
  .playlist-item.active{background:rgba(255,79,163,0.15); color:var(--pink);}
  .playlist-item .pi-dur{color:var(--muted); font-size:0.78rem;}

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:10px;}
</style>
</head>
<body>

<div class="player">
  <div class="player-top">
    <span class="label">Now Playing</span>
    <button class="playlist-btn" id="playlistToggle">Playlist ▾</button>
  </div>

  <div class="art" id="art"><div class="disc">🎵</div></div>

  <div class="track-info">
    <h3 id="trackTitle">—</h3>
    <p id="trackArtist">—</p>
  </div>

  <div class="progress-row">
    <span class="time" id="currentTime">0:00</span>
    <input type="range" id="progressBar" min="0" max="100" value="0">
    <span class="time end" id="durationTime">0:00</span>
  </div>

  <div class="controls">
    <button class="ctrl-btn small" id="prevBtn" title="Previous">⏮</button>
    <button class="ctrl-btn play-pause" id="playBtn" title="Play/Pause">▶</button>
    <button class="ctrl-btn small" id="nextBtn" title="Next">⏭</button>
  </div>

  <div class="volume-row">
    <span id="volIcon">🔊</span>
    <input type="range" id="volumeBar" min="0" max="100" value="70">
  </div>

  <div class="playlist" id="playlist"></div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
  const TRACKS = [
    { title: 'Theru Jaathara', artist: 'A.R. Rahman', src: 'https://raw.githubusercontent.com/praveennendrambakam/Songs/main/%5BiSongs.info%5D%2001%20-%20Theru%20Jaathara.mp3' },
    { title: 'Thaai Kelavi', artist: 'Anirudh Ravichander', src: 'https://raw.githubusercontent.com/thehamzaofficial/music_player/main/Thaai-Kelavi-Harish.mp3' },
    { title: 'Megham Karukatha', artist: 'Anirudh Ravichander', src: 'https://raw.githubusercontent.com/thehamzaofficial/music_player/main/Megham-Karukatha-Harish.mp3' },
    { title: 'Ponni Nadhi', artist: 'Anirudh Ravichander', src: 'https://raw.githubusercontent.com/thehamzaofficial/music_player/main/Ponni-Nadhi-Harish.mp3' },
    { title: 'Po Indru Neeyaga', artist: 'Anirudh Ravichander', src: 'https://raw.githubusercontent.com/thehamzaofficial/music_player/main/Po-Indru-Neeyaga-%20Harish.mp3' },
    { title: 'Poo Nee Poo', artist: 'Anirudh Ravichander', src: 'https://raw.githubusercontent.com/thehamzaofficial/music_player/main/Poo-Nee-Poo-Harish.mp3' },
    { title: 'Thenmozhi', artist: 'Anirudh Ravichander', src: 'https://raw.githubusercontent.com/thehamzaofficial/music_player/main/Thenmozhi-Harish.mp3' },
    { title: 'Maatna Gaali', artist: 'Anirudh Ravichander', src: 'https://raw.githubusercontent.com/thehamzaofficial/music_player/main/Maatna-Gaali-Harish.mp3' },
    { title: 'Life of Pazham', artist: 'Anirudh Ravichander', src: 'https://raw.githubusercontent.com/thehamzaofficial/music_player/main/Life-of-Pazham-Harish.mp3' },
    { title: 'Ey Inga Paaru', artist: 'Anirudh Ravichander', src: 'https://raw.githubusercontent.com/thehamzaofficial/music_player/main/Ey-Inga-Paaru-Harish.mp3' },
    { title: 'Va Kannamma', artist: 'Tamil Hits', src: 'https://raw.githubusercontent.com/JerishRaj/MyPlaylist/main/Va%20Kannamma%20%28PenduJatt.Com.Se%29.mp3' },
    { title: 'Velicha Poove Va', artist: 'Tamil Hits', src: 'https://raw.githubusercontent.com/JerishRaj/MyPlaylist/main/Velicha%20Poove%20Va%28SenSongsMp3.Co%29.mp3' },
    { title: 'Vinnaithaandi Varuvaaya', artist: 'A.R. Rahman', src: 'https://raw.githubusercontent.com/JerishRaj/MyPlaylist/main/Vinnaithaandi_Varuvaaya.mp3' },
  ];

  let currentIndex = 0;
  let isPlaying = false;

  const audio = document.getElementById('audio');
  const art = document.getElementById('art');
  const trackTitle = document.getElementById('trackTitle');
  const trackArtist = document.getElementById('trackArtist');
  const progressBar = document.getElementById('progressBar');
  const currentTimeEl = document.getElementById('currentTime');
  const durationTimeEl = document.getElementById('durationTime');
  const playBtn = document.getElementById('playBtn');
  const volumeBar = document.getElementById('volumeBar');
  const volIcon = document.getElementById('volIcon');
  const playlistEl = document.getElementById('playlist');
  const playlistToggle = document.getElementById('playlistToggle');

  function formatTime(sec) {
    if (isNaN(sec)) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function loadTrack(index, autoplay) {
    currentIndex = (index + TRACKS.length) % TRACKS.length;
    const t = TRACKS[currentIndex];
    audio.src = t.src;
    trackTitle.textContent = t.title;
    trackArtist.textContent = t.artist;
    renderPlaylist();
    if (autoplay) audio.play().then(() => setPlaying(true)).catch(() => setPlaying(false));
  }

  function setPlaying(playing) {
    isPlaying = playing;
    playBtn.textContent = playing ? '⏸' : '▶';
    art.classList.toggle('playing', playing);
  }

  function togglePlay() {
    if (!audio.src) loadTrack(0, false);
    if (isPlaying) { audio.pause(); setPlaying(false); }
    else { audio.play().then(() => setPlaying(true)).catch(() => {}); }
  }

  function renderPlaylist() {
    playlistEl.innerHTML = TRACKS.map((t, i) => `
      <div class="playlist-item ${i === currentIndex ? 'active' : ''}" data-index="${i}">
        <span>${t.title} — ${t.artist}</span>
        <span class="pi-dur">${i === currentIndex ? (isPlaying ? '♫' : '') : ''}</span>
      </div>
    `).join('');
  }

  audio.addEventListener('loadedmetadata', () => {
    durationTimeEl.textContent = formatTime(audio.duration);
  });
  audio.addEventListener('timeupdate', () => {
    if (audio.duration) {
      progressBar.value = (audio.currentTime / audio.duration) * 100;
      currentTimeEl.textContent = formatTime(audio.currentTime);
    }
  });
  audio.addEventListener('ended', () => loadTrack(currentIndex + 1, true));

  progressBar.addEventListener('input', () => {
    if (audio.duration) audio.currentTime = (progressBar.value / 100) * audio.duration;
  });

  volumeBar.addEventListener('input', () => {
    audio.volume = volumeBar.value / 100;
    volIcon.textContent = volumeBar.value == 0 ? '🔇' : volumeBar.value < 50 ? '🔉' : '🔊';
  });

  playBtn.addEventListener('click', togglePlay);
  document.getElementById('nextBtn').addEventListener('click', () => loadTrack(currentIndex + 1, isPlaying));
  document.getElementById('prevBtn').addEventListener('click', () => loadTrack(currentIndex - 1, isPlaying));

  playlistToggle.addEventListener('click', () => playlistEl.classList.toggle('open'));
  playlistEl.addEventListener('click', e => {
    const item = e.target.closest('.playlist-item');
    if (!item) return;
    loadTrack(Number(item.dataset.index), true);
  });

  audio.volume = 0.7;
  loadTrack(0, false);
</script>
</body>
</html>
